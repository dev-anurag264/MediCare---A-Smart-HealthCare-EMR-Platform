version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres

    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d healthcare_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - healthcare-network

  redis:
    image: redis:7-alpine
    container_name: medicare-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - healthcare-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: medicare-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - healthcare-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: medicare-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - healthcare-network

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: healthcare-app

    ports:
      - "8080:8080"

    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod

      # PostgreSQL
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthcare_db

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # JWT
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

      # Email
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}

      # File Uploads
      FILE_UPLOAD_DIR: /app/uploads

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Timezone
      TZ: Asia/Kolkata

    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - healthcare-network

    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  healthcare-network:
    driver: bridge

