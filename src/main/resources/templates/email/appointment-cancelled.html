<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: #dc2626; padding: 24px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 22px; }
        .body { padding: 32px; color: #333333; }
        .body p { line-height: 1.6; }
        .details { background: #fff5f5; border-left: 4px solid #dc2626; padding: 16px; border-radius: 4px; margin: 20px 0; }
        .details p { margin: 6px 0; }
        .footer { background: #f4f4f4; padding: 16px; text-align: center; font-size: 12px; color: #888888; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Appointment Cancelled</h1>
    </div>
    <div class="body">
        <p>Dear <strong th:text="${recipientName}">Recipient</strong>,</p>
        <p>The following appointment has been cancelled.</p>
        <div class="details">
            <p><strong>Patient:</strong> <span th:text="${patientName}"></span></p>
            <p><strong>Doctor:</strong> <span th:text="${doctorName}"></span></p>
            <p><strong>Date:</strong> <span th:text="${appointmentDate}"></span></p>
            <p><strong>Time:</strong> <span th:text="${startTime}"></span></p>
            <p><strong>Cancelled by:</strong> <span th:text="${cancelledBy}"></span></p>
        </div>
        <p>You can book a new appointment at your convenience.</p>
    </div>
    <div class="footer">
        <p>MediCare Healthcare - This is a system generated email, please do not reply.</p>
    </div>
</div>
</body>
</html>
