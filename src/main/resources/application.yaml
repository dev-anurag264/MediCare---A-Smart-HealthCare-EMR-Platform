spring:
  application:
    name: medicare-health-systems
  datasource:
    url: jdbc:postgresql://localhost:5432/medicare_db
    username: postgres
    password: 123

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect