spring:
  application:
    name: medicare-health-systems

  datasource:
    url: jdbc:postgresql://localhost:5432/medicare_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080

application:
  security:
    jwt:

      secret-key: ${JWT_SECRET:9YN1AS4nHG0BcmE/zplaX4q6zEymFQXez6X+VJEYIV4=}

      # 24 hours
      expiration: 86400000

      refresh-token:
        # 7 days
        expiration: 604800000

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    allowed-types: application/pdf,image/jpeg,image/png,image/gif
    max-file-size-bytes: 10485760

logging:
  level:
    org.springframework.security: DEBUG