spring:
  application:
    name: medicare-health-systems

  # Default profile is dev unless overridden by environment variable
  # In Docker: SPRING_PROFILES_ACTIVE=prod (set in docker-compose.yml)
  # In IntelliJ: dev (this default kicks in)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:9YN1AS4nHG0BcmE/zplaX4q6zEymFQXez6X+VJEYIV4=}
      expiration: 86400000
      refresh-token:
        expiration: 604800000

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    allowed-types: application/pdf,image/jpeg,image/png,image/gif
    max-file-size-bytes: 10485760

  mail:
    from-name: Medicare Health Systems

